<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>街コロオンライン</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Machi Koro Online</p>
        <h1>街コロオンライン</h1>
        <p>友人とURL・ルームコードで遊べるリアルタイム対戦版です。</p>
      </div>
      <div id="roomBadge" class="badge room-badge hidden">
        <span id="roomCodeText"></span>
        <button id="copyRoomCodeBtn" type="button" class="copy-code-btn">コードコピー</button>
        <button id="copyInviteBtn" type="button" class="copy-code-btn">招待リンク</button>
        <button id="openRoomOpsBtn" type="button" class="copy-code-btn room-ops-jump">ルーム操作</button>
        <button id="soundToggleBtn" type="button" class="copy-code-btn sound-toggle">効果音 ON</button>
        <label class="volume-control">音量 <input id="volumeSlider" type="range" min="0" max="100" value="70" /></label>
      </div>
    </header>

    <section id="lobby" class="panel">
      <h2>ルーム</h2>
      <div class="grid two">
        <label>名前
          <input id="nameInput" maxlength="18" placeholder="例: プレイヤー1" />
        </label>
        <label>ルームコード
          <input id="codeInput" maxlength="5" placeholder="参加時のみ" />
        </label>
      </div>
      <div class="deck-select-box" aria-label="プレイするデッキ">
        <div class="deck-select-head">
          <div>
            <strong>プレイするデッキを選択</strong>
            <p>通常版・街コロ＋・街コロ#・全部入り・街コロ通を選べます。</p>
          </div>
        </div>

        <div class="deck-choice-grid">
          <label class="deck-choice-card base-choice">
            <input type="radio" name="deckMode" value="base" checked />
            <span class="deck-choice-top">
              <span class="deck-choice-icon">🏙️</span>
              <span class="deck-choice-badge">基本</span>
            </span>
            <span class="deck-choice-title">街コロ</span>
            <span class="deck-choice-desc">基本カードだけで遊ぶ標準ルール。これまでの通常プレイと同じです。</span>
          </label>

          <label class="deck-choice-card plus-choice">
            <input type="radio" name="deckMode" value="plus" />
            <span class="deck-choice-top">
              <span class="deck-choice-icon">⚓</span>
              <span class="deck-choice-badge plus">拡張</span>
            </span>
            <span class="deck-choice-title">街コロ＋</span>
            <span class="deck-choice-desc">基本カードに拡張カードを混ぜて遊びます。</span>
          </label>


          <label class="deck-choice-card sharp-choice">
            <input type="radio" name="deckMode" value="sharp" />
            <span class="deck-choice-top">
              <span class="deck-choice-icon">#</span>
              <span class="deck-choice-badge sharp">休業</span>
            </span>
            <span class="deck-choice-title">街コロ#</span>
            <span class="deck-choice-desc">基本カードに街コロ#カードを混ぜて遊びます。</span>
          </label>

          <label class="deck-choice-card all-choice">
            <input type="radio" name="deckMode" value="all" />
            <span class="deck-choice-top">
              <span class="deck-choice-icon">✨</span>
              <span class="deck-choice-badge all">全部入り</span>
            </span>
            <span class="deck-choice-title">全部入り</span>
            <span class="deck-choice-desc">街コロ＋と街コロ#をどちらも混ぜて遊びます。</span>
          </label>

          <label class="deck-choice-card two-choice">
            <input type="radio" name="deckMode" value="two" />
            <span class="deck-choice-top">
              <span class="deck-choice-icon">🆕</span>
              <span class="deck-choice-badge two">独立</span>
            </span>
            <span class="deck-choice-title">街コロ通</span>
            <span class="deck-choice-desc">3列市場・初期建設・共通ランドマークを使う独立した新ルールです。</span>
          </label>
        </div>

        <div id="deckModeHelp" class="deck-mode-help">
          <strong>街コロ：</strong>基本カードのみ。通常プレイを壊さず、今まで通り遊べます。
        </div>
      </div>
      <div class="actions">
        <button id="createBtn">ルーム作成</button>
        <button id="joinBtn" class="secondary">参加</button>
      </div>
      <p id="lobbyMsg" class="message"></p>
    </section>

    <main id="game" class="hidden">
      <section class="panel topbar">
        <div class="status-area">
          <h2 id="statusTitle">待機中</h2>
          <p id="statusText"></p>
          <div id="turnBanner" class="turn-banner hidden"></div>
          <div id="victoryBanner" class="victory-banner hidden"></div>
          <p id="gameMsg" class="message"></p>
          <div id="rollNotice" class="roll-notice hidden"></div>
          <div id="recentNotice" class="recent-notice hidden"></div>
        </div>
        <div class="turn-action-card">
          <div class="turn-action-head">
            <h2>手番アクション</h2>
          </div>
          <div id="turnActions"></div>
        </div>
      </section>

      <section class="panel players-panel">
        <h2>プレイヤー</h2>
        <div id="players"></div>
      </section>

      <section class="panel">
        <h2>建設</h2>
        <h3>ランドマーク</h3>
        <div id="landmarks" class="cards"></div>
        <h3>施設</h3>
        <div id="cards" class="cards"></div>
      </section>

      <section class="panel logs-panel">
        <h2>ログ</h2>
        <div id="logs" class="logs"></div>
      </section>

      <section id="hostAdminPanel" class="panel host-admin hidden">
        <details>
          <summary>ホスト管理</summary>
          <div id="hostAdminBody" class="host-admin-body"></div>
        </details>
      </section>

      <section id="roomOpsPanel" class="panel room-ops hidden">
        <details>
          <summary>ルーム操作</summary>
          <div id="roomOpsBody" class="room-ops-body"></div>
        </details>
      </section>

      <div id="stickyHud" class="sticky-hud hidden" aria-live="polite"></div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
